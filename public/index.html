<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f2ea" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="《来，签合同》是一款单人合同交涉游戏。读合同，和对方谈，把互相冲突的原话摆在一起。"
    />
    <title>来，签合同</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="./">
        <span class="brand-seal" aria-hidden="true">签</span>
        <span class="brand-word">
          <strong>来，签合同</strong>
          <small>CONTRACT, PLEASE</small>
        </span>
      </a>
      <div class="mast-actions" id="mast-actions" hidden>
        <a id="home-link" class="quiet" href="./">章节首页</a>
        <button id="restart" type="button" class="quiet">重新开始</button>
        <button id="finish" type="button" class="primary">结束审阅</button>
      </div>
    </header>

    <main id="lobby" class="lobby">
      <div class="lobby-layout">
        <section class="lobby-intro">
          <h1>来，<br />签合同</h1>
          <div class="lobby-lead">
            <p class="lobby-lede">面试时说的，和纸上写的一样吗？<br />笔还没落下，一切都来得及。</p>
            <a id="lobby-continue" class="primary lobby-continue" hidden>
              <span id="lobby-continue-label">打开第一份邀约</span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </div>
        </section>

        <section class="invitations" aria-labelledby="invitations-title">
          <div class="invitations-head">
            <h2 id="invitations-title">你的邀约</h2>
            <p id="chapter-progress"></p>
          </div>
          <ol id="chapter-list"></ol>
          <p class="invitations-note">交涉进度保存在本机浏览器</p>
        </section>
      </div>
      <footer class="lobby-footer">改编自公开劳动争议案例，人物、公司与剧情均为虚构。</footer>
    </main>

    <main id="workspace" class="workspace" hidden>
      <div class="case-title">
        <h1 id="case-title"></h1>
        <p id="case-setting"></p>
      </div>

      <nav class="pane-tabs" aria-label="切换桌面区域">
        <button type="button" id="tab-docs" aria-pressed="false">合同与资料</button>
        <button type="button" id="tab-chat" aria-pressed="true">交涉</button>
      </nav>

      <div class="board" data-pane="chat">
        <section class="panel dossier" aria-labelledby="docs-heading">
          <div class="panel-head">
            <h2 id="docs-heading">合同与资料</h2>
            <span id="doc-count" class="minor"></span>
          </div>
          <nav id="file-tabs" aria-label="已收到的文件"></nav>
          <div id="sheet" class="sheet" tabindex="0" aria-label="当前文件"></div>
          <div id="doc-footer" class="doc-footer" hidden></div>
        </section>

        <section class="panel chat" aria-labelledby="contact">
          <div class="panel-head">
            <div class="contact">
              <span id="avatar" aria-hidden="true"></span>
              <div class="contact-id">
                <h2 id="contact"></h2>
                <p id="contact-role"></p>
              </div>
            </div>
            <div id="patience"></div>
          </div>
          <div id="timeline" class="timeline" role="log" aria-label="交涉记录" aria-live="off" tabindex="0">
            <p class="chat-date">签署前 · 交涉记录</p>
          </div>
          <div id="composer" class="composer" aria-label="交涉操作"></div>
        </section>
      </div>
    </main>

    <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
